services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: piravienfive/tech613-ttt:1.0
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/posts
    depends_on:
      mongo:
        condition: service_healthy
    command: ["sh", "-c", "node seeds/seed.js && node index.js"]

volumes:
  mongo-data:
